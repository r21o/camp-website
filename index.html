<!DOCTYPE html>
<html lang="ja">
<head>
  <title>Example Website</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #ffd6e8 0%, #ffecd2 50%, #d4f1f9 100%);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    .bubble { position: fixed; border-radius: 50%; opacity: 0.22; animation: floatBubble var(--dur) ease-in-out infinite alternate; pointer-events: none; }
    @keyframes floatBubble { from { transform: translateY(0) scale(1); } to { transform: translateY(-28px) scale(1.05); } }

    /* 背景パーティクル */
    .particle {
      position: fixed;
      pointer-events: none;
      font-size: var(--sz);
      animation: rise var(--dur) ease-in var(--delay) infinite;
      opacity: 0;
      z-index: 0;
    }
    @keyframes rise {
      0%   { transform: translateY(0) rotate(0deg) scale(0.8);   opacity: 0; }
      10%  { opacity: 0.7; }
      80%  { opacity: 0.4; }
      100% { transform: translateY(-100vh) rotate(var(--rot)) scale(1.2); opacity: 0; }
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    /* ヒーローエリア */
    .hero {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(20px);
      border-radius: 36px;
      padding: 36px 40px 32px;
      box-shadow: 0 8px 40px rgba(255,150,180,0.22), 0 2px 0 rgba(255,255,255,0.9) inset;
      border: 2px solid rgba(255,255,255,0.85);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mascot-img {
      width: 100px; height: 100px;
      object-fit: contain;
      margin-bottom: 14px;
      animation: bounce 2.4s ease-in-out infinite;
      filter: drop-shadow(0 6px 16px rgba(255,150,180,0.35));
    }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    h1 {
      font-family: 'Kaisei Decol', serif;
      font-size: 2rem;
      color: #e07aaa;
      margin-bottom: 8px;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(224,122,170,0.25);
    }
    .description { color: #b0a0b8; font-size: 0.88rem; letter-spacing: 0.5px; }

    /* セクションラベル */
    .section-label {
      font-size: 0.72rem;
      color: #c4a0c8;
      letter-spacing: 3px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::before, .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(249,168,212,0.4);
    }

    /* リンクグリッド */
    .link-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .link-card {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(16px);
      border-radius: 22px;
      border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 4px 16px rgba(255,150,180,0.12);
      padding: 18px 10px 14px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.22s cubic-bezier(.34,1.56,.64,1);
    }
    .link-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 28px rgba(244,114,182,0.3);
      border-color: #f9a8d4;
      background: rgba(255,240,248,0.9);
    }

    .link-icon {
      font-size: 2rem;
      line-height: 1;
    }
    .link-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #9a4a7a;
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    /* 外部リンクはちょっとちがう見た目 */
    .link-card.external {
      background: rgba(249,168,212,0.12);
      border-color: rgba(249,168,212,0.35);
    }
    .link-card.external .link-label { color: #b060a0; }

    /* フッター */
    .footer-deco { font-size: 1.3rem; letter-spacing: 6px; opacity: 0.45; margin-top: 20px; }
  </style>
</head>
<body>

<div class="bubble" style="width:300px;height:300px;background:#ffd6e8;top:-80px;left:-80px;--dur:6s"></div>
<div class="bubble" style="width:200px;height:200px;background:#ffc0d4;bottom:-60px;right:-40px;--dur:8s"></div>
<div class="bubble" style="width:140px;height:140px;background:#ffecd2;top:40%;left:76%;--dur:7s"></div>

<main>

  <!-- ヒーロー -->
  <div class="hero">
    <img src="computer01_smile.png" alt="笑顔のコンピューター" class="mascot-img">
    <h1>💗 ようこそ！ 💗</h1>
    <p class="description">これはわたしのウェブサイトです 🎀</p>
    <p style="font-size:1.4rem;letter-spacing:6px;margin-top:12px;opacity:0.6">💖 🎀 💗 🎀 💖</p>
  </div>

  <!-- 外部リンク -->
  <p class="section-label">🎀 リンク 🎀</p>
  <div class="link-grid" style="grid-template-columns: repeat(2,1fr); margin-bottom:20px;">
    <a href="https://www.google.com/" target="_blank" class="link-card external">
      <span class="link-icon">🔍</span>
      <span class="link-label">Google</span>
    </a>
    <a href="https://www.yahoo.co.jp/" target="_blank" class="link-card external">
      <span class="link-icon">📰</span>
      <span class="link-label">Yahoo! JAPAN</span>
    </a>
  </div>

  <!-- ページリンク -->
  <p class="section-label">💗 コンテンツ 💗</p>
  <div class="link-grid">
    <a href="guessgame.html" class="link-card">
      <span class="link-icon">🎮</span>
      <span class="link-label">かずあてゲーム</span>
    </a>
    <a href="pokemon.html" class="link-card">
      <span class="link-icon">🔮</span>
      <span class="link-label">ポケモン図鑑</span>
    </a>
    <a href="nasa.html" class="link-card">
      <span class="link-icon">🌌</span>
      <span class="link-label">NASA 天体写真</span>
    </a>
    <a href="hanabi.html" class="link-card">
      <span class="link-icon">🎆</span>
      <span class="link-label">花火</span>
    </a>
    <a href="local_storage.html" class="link-card">
      <span class="link-icon">📝</span>
      <span class="link-label">やることリスト</span>
    </a>
    <a href="sake.html" class="link-card">
      <span class="link-icon">🍶</span>
      <span class="link-label">日本酒えらび</span>
    </a>
    <a href="pikmin.html" class="link-card">
      <span class="link-icon">🌿</span>
      <span class="link-label">ピクミン図鑑</span>
    </a>
    <a href="omikuji.html" class="link-card">
      <span class="link-icon">🎋</span>
      <span class="link-label">おみくじ</span>
    </a>
    <a href="game.html" class="link-card">
      <span class="link-icon">⌨️</span>
      <span class="link-label">タイピング</span>
    </a>
  </div>

  <p class="footer-deco">💖 🎀 💗 🎀 💖 🎀 💗 🎀 💖</p>
</main>

<script>
  const symbols = ['💗','🎀','💖','💝','✨','💕','🌸','💓'];
  const sizes   = ['1.2rem','1.5rem','1.8rem','2rem','2.4rem'];

  for (let i = 0; i < 28; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    const sym  = symbols[Math.floor(Math.random() * symbols.length)];
    const sz   = sizes[Math.floor(Math.random() * sizes.length)];
    const left = Math.random() * 100;
    const dur  = (6 + Math.random() * 10).toFixed(1) + 's';
    const delay = (Math.random() * 10).toFixed(1) + 's';
    const rot  = (Math.random() * 60 - 30).toFixed(0) + 'deg';
    el.textContent = sym;
    el.style.cssText = `left:${left}%;bottom:-4rem;--sz:${sz};--dur:${dur};--delay:${delay};--rot:${rot}`;
    document.body.appendChild(el);
  }
</script>
</body>
</html>
